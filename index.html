<!doctype html>
<html lang="el">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta id="theme-color" name="theme-color" content="#ffffff">
  <meta name="description" content="Meal Reveal — διατροφικό ημερολόγιο και ανάλυση γεύματος">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Meal Reveal">
  <title>Meal Reveal</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="32x32" href="./icons/meal-reveal-favicon-32.png?v=12">
  <link rel="icon" type="image/png" sizes="64x64" href="./icons/meal-reveal-favicon-64.png?v=12">
  <link rel="apple-touch-icon" sizes="180x180" href="./icons/apple-touch-icon-180.png?v=12">
  <script>
    try {
      const savedTheme = localStorage.getItem("mealRevealTheme");
      document.documentElement.dataset.theme = savedTheme === "dark" ? "dark" : "light";
    } catch (_) {
      document.documentElement.dataset.theme = "light";
    }
  </script>
  <style>
    :root {
      color-scheme: light;
      --shell-background: #fff;
      --shell-text: #222;
      --fallback-background: rgba(255,255,255,.92);
    }
    :root[data-theme="dark"] {
      color-scheme: dark;
      --shell-background: #0e1117;
      --shell-text: #fafafa;
      --fallback-background: rgba(38,39,48,.94);
    }
    * { box-sizing: border-box; }
    html {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      min-width: 0;
      min-height: 0;
      margin: 0;
      background: var(--shell-background);
      overflow: hidden;
      overscroll-behavior: none;
    }
    body {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      min-width: 0;
      min-height: 0;
      margin: 0;
      overflow: hidden;
      overscroll-behavior: none;
      background: var(--shell-background);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    #app {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      max-width: none;
      max-height: none;
      border: 0;
      display: block;
      background: var(--shell-background);
    }
    #loading {
      position: fixed;
      inset: 0;
      z-index: 2;
      display: grid;
      place-items: center;
      background: var(--shell-background);
      transition: opacity .2s ease;
    }
    #loading.hidden { opacity: 0; pointer-events: none; }
    #loading img { width: min(62vw, 260px); height: auto; }
    #offline {
      position: fixed;
      left: 1rem;
      right: 1rem;
      bottom: calc(1rem + env(safe-area-inset-bottom));
      z-index: 3;
      display: none;
      padding: .75rem 1rem;
      border-radius: .75rem;
      color: #fff;
      background: #222;
      text-align: center;
      font-size: .9rem;
    }
    #offline.visible { display: block; }
    .fallback {
      position: fixed;
      right: .6rem;
      bottom: calc(.6rem + env(safe-area-inset-bottom));
      z-index: 1;
      padding: .45rem .65rem;
      border-radius: 999px;
      color: var(--shell-text);
      background: var(--fallback-background);
      box-shadow: 0 1px 5px rgba(0,0,0,.18);
      font-size: .75rem;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div id="loading" aria-live="polite">
    <img src="./icons/meal-reveal-512.png?v=12" alt="Άνοιγμα Meal Reveal">
  </div>
  <div id="offline">Δεν υπάρχει σύνδεση στο διαδίκτυο.</div>
  <iframe
    id="app"
    title="Meal Reveal"
    src="about:blank"
    allow="camera; microphone; clipboard-read; clipboard-write"
    referrerpolicy="strict-origin-when-cross-origin"
  ></iframe>
  <a class="fallback" href="https://nutrition-app-kdzwt3aqnwjxgxdzgoefp6.streamlit.app/" target="_blank" rel="noopener">Άνοιγμα σε browser</a>
  <script>
    const loading = document.getElementById("loading");
    const offline = document.getElementById("offline");
    const app = document.getElementById("app");
    const fallback = document.querySelector(".fallback");
    const themeColor = document.getElementById("theme-color");
    const streamlitBase = "https://nutrition-app-kdzwt3aqnwjxgxdzgoefp6.streamlit.app/";
    const streamlitOrigin = new URL(streamlitBase).origin;
    const bridgeBytes = new Uint8Array(24);
    crypto.getRandomValues(bridgeBytes);
    const bridgeNonce = Array.from(bridgeBytes, byte =>
      byte.toString(16).padStart(2, "0")
    ).join("");
    // Remove the obsolete wrapper-level token that caused repeated reloads.
    try { localStorage.removeItem("mealRevealRememberedSessionV1"); } catch (_) {}

    // Force the nested Streamlit document to receive a real iframe resize on
    // Android after rotation. No viewport dimensions are guessed or retained.
    function refreshAppLayout() {
      const pulse = () => {
        app.style.width = "calc(100% - 1px)";
        window.requestAnimationFrame(() => { app.style.width = "100%"; });
      };
      pulse();
      window.setTimeout(pulse, 120);
      window.setTimeout(pulse, 420);
    }
    window.addEventListener("orientationchange", refreshAppLayout, { passive: true });
    window.addEventListener("resize", refreshAppLayout, { passive: true });
    if (window.visualViewport) {
      window.visualViewport.addEventListener("resize", refreshAppLayout, { passive: true });
    }

    function savedTheme() {
      try {
        return localStorage.getItem("mealRevealTheme") === "dark" ? "dark" : "light";
      } catch (_) {
        return "light";
      }
    }

    function applyShellTheme(theme) {
      const safeTheme = theme === "dark" ? "dark" : "light";
      document.documentElement.dataset.theme = safeTheme;
      themeColor.content = safeTheme === "dark" ? "#0e1117" : "#ffffff";
      try { localStorage.setItem("mealRevealTheme", safeTheme); } catch (_) {}
      const fallbackUrl = new URL(streamlitBase);
      fallbackUrl.searchParams.set("display_theme", safeTheme);
      fallback.href = fallbackUrl.toString();
    }

    const initialTheme = savedTheme();
    applyShellTheme(initialTheme);
    const appUrl = new URL(streamlitBase);
    appUrl.searchParams.set("embed", "true");
    appUrl.searchParams.set("embed_options", "show_toolbar");
    appUrl.searchParams.set("display_theme", initialTheme);
    appUrl.searchParams.set("mobile_bridge", bridgeNonce);
    app.src = appUrl.toString();

    window.addEventListener("message", event => {
      const message = event.data;
      if (!message || typeof message.type !== "string") return;
      if (message.type === "meal-reveal-auth-storage") {
        // Streamlit components may use an opaque about:srcdoc origin ("null").
        // The per-load nonce restricts this bridge to our own component.
        if (event.origin !== streamlitOrigin && event.origin !== "null") return;
        const allowedActions = ["read", "write", "clear"];
        const validRequest = typeof message.requestId === "string"
          && message.requestId.length <= 128
          && message.bridgeNonce === bridgeNonce
          && message.storageKey === "mealRevealRememberedSessionV2"
          && allowedActions.includes(message.action)
          && typeof message.payload === "string"
          && message.payload.length <= 16384;
        if (!validRequest) return;
        let payload = "";
        try {
          if (message.action === "clear") {
            localStorage.removeItem(message.storageKey);
          } else if (message.action === "write") {
            payload = message.payload;
            if (payload) localStorage.setItem(message.storageKey, payload);
            else localStorage.removeItem(message.storageKey);
          } else {
            payload = localStorage.getItem(message.storageKey) || "";
          }
        } catch (_) {
          payload = "";
        }
        if (event.source && typeof event.source.postMessage === "function") {
          event.source.postMessage({
            type: "meal-reveal-auth-storage-result",
            requestId: message.requestId,
            bridgeNonce,
            payload
          }, event.origin === "null" ? "*" : event.origin);
        }
        return;
      }
      if (event.origin !== streamlitOrigin) return;
      if (message.type === "meal-reveal-theme"
          && ["dark", "light"].includes(message.theme)) {
        applyShellTheme(message.theme);
        return;
      }
    });

    app.addEventListener("load", () => {
      refreshAppLayout();
      loading.classList.add("hidden");
    });
    setTimeout(() => loading.classList.add("hidden"), 12000);

    function updateConnection() {
      offline.classList.toggle("visible", !navigator.onLine);
    }
    window.addEventListener("online", updateConnection);
    window.addEventListener("offline", updateConnection);
    updateConnection();

    if ("serviceWorker" in navigator) {
      window.addEventListener("load", async () => {
        const registration = await navigator.serviceWorker.register(
          "./service-worker.js?v=11", { updateViaCache: "none" }
        );
        registration.update();
      });
    }
  </script>
</body>
</html>
